<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guarda & Rotina - Sofia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Manifesto PWA para Instalar como App no Celular -->
    <link id="pwa-manifest" rel="manifest" href="data:application/manifest+json;charset=utf-8,{
        %22name%22: %22Guarda e Rotina da Sofia%22,
        %22short_name%22: %22Sofia%22,
        %22start_url%22: %22.%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22%23f9f9f9%22,
        %22theme_color%22: %22%239333ea%22,
        %22icons%22: [{%22src%22: %22https://cdn-icons-png.flaticon.com/512/2922/2922510.png%22, %22sizes%22: %22512x512%22, %22type%22: %22image/png%22}]
    }">
    <style>
        :root {
            --primary-color: #7e22ce;
            --secondary-color: #f3e8ff;
            --bg-color: #fcf8ff;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e9d5ff;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 5px;
        }
        .header h2 {
            color: var(--primary-color);
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }
        .calendar-day-header {
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            color: #6b21a8;
            padding: 4px;
            text-transform: uppercase;
        }
        .calendar-cell {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            min-height: 85px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .calendar-cell.other-month {
            opacity: 0.35;
            background: #f3f4f6;
        }
        .calendar-cell.today {
            border: 2px solid #7e22ce;
            background-color: #faf5ff;
        }
        .day-number {
            font-weight: bold;
            font-size: 12px;
            color: #581c87;
        }
        .event-tag {
            background-color: #f3e8ff;
            color: #6b21a8;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 2px solid #7e22ce;
        }
    </style>
</head>
<body class="bg-purple-50/40 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-200 pb-28">

    <!-- TELA DE LOGIN / SEGURANÇA COM PIN 1510 E BIOMETRIA -->
    <div id="tela-login" class="fixed inset-0 z-50 bg-purple-950/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 p-6 sm:p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center space-y-4 border border-purple-100 dark:border-gray-700">
            <div class="w-16 h-16 bg-purple-50 dark:bg-purple-950/50 rounded-2xl mx-auto flex items-center justify-center text-3xl">👩‍👧</div>
            <div>
                <h2 class="text-xl font-bold text-gray-900 dark:text-white">Guarda & Rotina - Sofia</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Acesso Restrito</p>
            </div>
            
            <form onsubmit="verificarLogin(event)" class="space-y-3 text-left">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase mb-1">Senha (PIN)</label>
                    <input type="password" id="input-senha" required placeholder="••••" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-purple-500 dark:text-white">
                </div>
                <button type="submit" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-medium py-3 rounded-xl transition text-sm shadow-sm">
                    Entrar com Senha PIN
                </button>
            </form>

            <button type="button" onclick="entrarComBiometria()" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-medium py-3 rounded-xl transition text-sm shadow-sm flex items-center justify-center gap-2">
                <span>🔐</span> Entrar com Biometria
            </button>

            <p id="erro-senha" class="text-xs text-red-500 hidden font-medium">Senha incorreta! A senha correta é 1510.</p>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL (OCULTO ATÉ LOGIN) -->
    <div id="conteudo-site" class="hidden container" id="printableArea">
        <div class="header">
            <h2>👩‍👧 Guarda & Rotina - Sofia</h2>
        </div>

        <!-- CONTROLO DE MÊS E ANO -->
        <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-purple-100 dark:border-gray-700 mb-6 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <button onclick="mudarMes(-1)" class="px-3 py-1.5 bg-purple-100 dark:bg-purple-950 text-purple-800 dark:text-purple-300 rounded-lg text-xs font-bold">◀ Mês Anterior</button>
                <h3 id="mesAnoTitulo" class="text-sm font-black uppercase text-purple-900 dark:text-purple-300 min-width-[140px] text-center">Setembro 2026</h3>
                <button onclick="mudarMes(1)" class="px-3 py-1.5 bg-purple-100 dark:bg-purple-950 text-purple-800 dark:text-purple-300 rounded-lg text-xs font-bold">Próximo Mês ▶</button>
            </div>
            <button onclick="irParaHoje()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold">📅 Hoje</button>
        </div>

        <!-- CALENDÁRIO MENSAL -->
        <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-purple-100 dark:border-gray-700 mb-6">
            <div class="calendar-grid">
                <div class="calendar-day-header">Dom</div>
                <div class="calendar-day-header">Seg</div>
                <div class="calendar-day-header">Ter</div>
                <div class="calendar-day-header">Qua</div>
                <div class="calendar-day-header">Qui</div>
                <div class="calendar-day-header">Sex</div>
                <div class="calendar-day-header">Sáb</div>
            </div>
            <div id="calendarDaysGrid" class="calendar-grid"></div>
        </div>

        <!-- PAINEL DE ADICIONAR EVENTO / COMPROMISSO -->
        <div class="print-hidden bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-purple-100 dark:border-gray-700 max-w-xl mx-auto space-y-3">
            <h3 class="text-xs font-bold uppercase text-purple-800 dark:text-purple-400">✨ Adicionar Compromisso ou Nota da Sofia</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Data</label>
                    <input type="date" id="inputDataSofia" class="w-full text-xs p-2 bg-gray-50 dark:bg-gray-900 border rounded-lg font-bold">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Descrição / Guarda</label>
                    <input type="text" id="inputDescSofia" placeholder="Ex: Escola, Médico, Com a Mãe..." class="w-full text-xs p-2 bg-gray-50 dark:bg-gray-900 border rounded-lg">
                </div>
            </div>
            <button onclick="adicionarEventoSofia()" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-2.5 rounded-lg text-xs transition">
                ✓ Adicionar Evento (OK)
            </button>
        </div>
    </div>

    <!-- BARRA INFERIOR FIXA -->
    <div class="print-hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 px-4 py-2 flex justify-between items-center max-w-2xl mx-auto rounded-t-2xl shadow-lg">
        <div class="flex items-center gap-2">
            <button onclick="alternarDarkMode()" class="px-3 py-1.5 rounded-xl bg-gray-100 dark:bg-gray-800 text-xs font-semibold">🌙/☀️</button>
            <button onclick="instalarApp()" class="px-3 py-1.5 rounded-xl bg-purple-100 dark:bg-purple-950 text-purple-800 dark:text-purple-300 text-xs font-bold">📱 Instalar App</button>
            <button onclick="bloquearNovamente()" class="px-3 py-1.5 rounded-xl bg-gray-100 dark:bg-gray-800 text-xs font-semibold text-red-600">🔒 Sair</button>
        </div>
        <button onclick="ouvirVozSofia()" class="bg-red-600 hover:bg-red-700 text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center text-lg">🎤</button>
    </div>

    <script>
        const SENHA_MESTRA = "1510";
        const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        let dataAtual = new Date();
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('autenticado_sofia') === 'true') liberarAcesso();
            if (localStorage.getItem('dark_mode_sofia') === 'true') document.documentElement.classList.add('dark');
            document.getElementById('inputDataSofia').valueAsDate = new Date();
        });

        function instalarApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
            } else {
                alert("📱 Para instalar no celular, toque nas opções do navegador e selecione 'Adicionar à tela inicial'.");
            }
        }

        function verificarLogin(e) {
            e.preventDefault();
            if (document.getElementById('input-senha').value === SENHA_MESTRA) {
                sessionStorage.setItem('autenticado_sofia', 'true');
                liberarAcesso();
            } else {
                document.getElementById('erro-senha').classList.remove('hidden');
            }
        }

        async function entrarComBiometria() {
            try {
                const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                if (!available) return alert("Biometria não disponível neste aparelho.");
                const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
                const cred = await navigator.credentials.create({
                    publicKey: { challenge, rp: { name: "Rotina Sofia", id: window.location.hostname }, user: { id: new Uint8Array(16), name: "sofia@local", displayName: "Mariana" }, pubKeyCredParams: [{alg: -7, type: "public-key"}] }
                });
                if(cred) { sessionStorage.setItem('autenticado_sofia', 'true'); liberarAcesso(); }
            } catch(e) { alert("Use a senha PIN (1510)."); }
        }

        function liberarAcesso() {
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('conteudo-site').classList.remove('hidden');
            renderizarCalendario();
        }

        function bloquearNovamente() {
            sessionStorage.removeItem('autenticado_sofia');
            document.getElementById('conteudo-site').classList.add('hidden');
            document.getElementById('tela-login').classList.remove('hidden');
        }

        function mudarMes(direcao) {
            dataAtual.setMonth(dataAtual.getMonth() + direcao);
            renderizarCalendario();
        }

        function irParaHoje() {
            dataAtual = new Date();
            renderizarCalendario();
        }

        function renderizarCalendario() {
            const ano = dataAtual.getFullYear();
            const mes = dataAtual.getMonth();
            document.getElementById('mesAnoTitulo').innerText = `${nomesMeses[mes]} ${ano}`;

            const primeiroDiaDoMes = new Date(ano, mes, 1).getDay();
            const ultimoDiaDoMes = new Date(ano, mes + 1, 0).getDate();
            const ultimoDiaMesAnterior = new Date(ano, mes, 0).getDate();

            const grid = document.getElementById('calendarDaysGrid');
            grid.innerHTML = '';

            let eventosSalvos = JSON.parse(localStorage.getItem('eventos_sofia_map')) || {};

            // Dias do mês anterior
            for (let i = primeiroDiaDoMes; i > 0; i--) {
                let diaNum = ultimoDiaMesAnterior - i + 1;
                let cell = document.createElement('div');
                cell.className = "calendar-cell other-month";
                cell.innerHTML = `<span class="day-number">${diaNum}</span>`;
                grid.appendChild(cell);
            }

            // Dias do mês atual
            const hoje = new Date();
            for (let dia = 1; dia <= ultimoDiaDoMes; dia++) {
                let cell = document.createElement('div');
                let dataIso = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                let isToday = (dia === hoje.getDate() && mes === hoje.getMonth() && ano === hoje.getFullYear());

                cell.className = `calendar-cell ${isToday ? 'today' : ''}`;
                
                let eventosHtml = '';
                if (eventosSalvos[dataIso]) {
                    eventosSalvos[dataIso].forEach((ev, idx) => {
                        eventosHtml += `<div class="event-tag"><span>${ev}</span><button onclick="apagarEventoSofia('${dataIso}', ${idx})" class="text-red-600 font-bold ml-1">✕</button></div>`;
                    });
                }

                cell.innerHTML = `<span class="day-number">${dia}</span><div class="space-y-1 overflow-y-auto max-h-16">${eventosHtml}</div>`;
                grid.appendChild(cell);
            }
        }

        function adicionarEventoSofia() {
            const dataStr = document.getElementById('inputDataSofia').value;
            const desc = document.getElementById('inputDescSofia').value.trim().toUpperCase();
            if(!dataStr || !desc) return alert("Preencha a data e a descrição.");

            let eventosSalvos = JSON.parse(localStorage.getItem('eventos_sofia_map')) || {};
            if(!eventosSalvos[dataStr]) eventosSalvos[dataStr] = [];
            eventosSalvos[dataStr].push(desc);

            localStorage.setItem('eventos_sofia_map', JSON.stringify(eventosSalvos));
            document.getElementById('inputDescSofia').value = '';
            renderizarCalendario();
        }

        function apagarEventoSofia(data, index) {
            let eventosSalvos = JSON.parse(localStorage.getItem('eventos_sofia_map')) || {};
            if(eventosSalvos[data]) {
                eventosSalvos[data].splice(index, 1);
                if(eventosSalvos[data].length === 0) delete eventosSalvos[data];
                localStorage.setItem('eventos_sofia_map', JSON.stringify(eventosSalvos));
                renderizarCalendario();
            }
        }

        function alternarDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('dark_mode_sofia', document.documentElement.classList.contains('dark'));
        }

        function ouvirVozSofia() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) return alert("Reconhecimento de voz não suportado.");
            const rec = new SpeechRecognition();
            rec.lang = 'pt-PT';
            rec.onresult = (e) => {
                document.getElementById('inputDescSofia').value = e.results[0][0].transcript.toUpperCase();
                adicionarEventoSofia();
            };
            rec.start();
        }
    </script>
</body>
</html>
