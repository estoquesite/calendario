<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guarda Compartilhada Sophia</title>
    <!-- Ícone personalizado -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3209/3209265.png" type="image/png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen text-gray-800 dark:text-gray-100 transition-colors duration-200 pb-28 select-none">

    <!-- TELA DE LOGIN / CAPA COM PIN 1510 E BIOMETRIA -->
    <div id="tela-login" class="fixed inset-0 z-50 bg-gray-900/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 p-6 sm:p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center space-y-4 border border-gray-100 dark:border-gray-700">
            <div class="w-16 h-16 bg-blue-50 dark:bg-blue-950/50 rounded-2xl mx-auto flex items-center justify-center text-3xl">👧</div>
            <div>
                <h2 class="text-xl font-bold text-gray-900 dark:text-white">Acesso Restrito</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Guarda Compartilhada - Sophia</p>
            </div>
            
            <form onsubmit="verificarLogin(event)" class="space-y-3 text-left">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase mb-1">Senha (PIN)</label>
                    <input type="password" id="input-senha" required placeholder="••••" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition text-sm shadow-sm">
                    Entrar com Senha PIN
                </button>
            </form>

            <button type="button" onclick="entrarComBiometria()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition text-sm shadow-sm flex items-center justify-center gap-2">
                <span>🔐</span> Entrar com Biometria
            </button>

            <p id="erro-senha" class="text-xs text-red-500 hidden font-medium">Senha incorreta! A senha correta é 1510.</p>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL DA SOPHIA -->
    <div id="conteudo-site" class="hidden max-w-lg mx-auto p-2.5 space-y-2.5">
        
        <!-- PAINEL SUPERIOR: QUEM SELECIONA + ESTATÍSTICAS -->
        <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-2">
            
            <!-- BOTÕES PARA ESCOLHER QUEM VAI SER PINTADO NO CALENDÁRIO -->
            <div class="flex items-center justify-between bg-gray-100 dark:bg-gray-900 p-1.5 rounded-xl border border-gray-200 dark:border-gray-700">
                <span class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase px-2">Selecionar para:</span>
                <div class="flex gap-1.5">
                    <button type="button" id="btnSeletorMae" onclick="definirResponsavelSelecao('mae')" class="px-3 py-1 rounded-lg text-xs font-bold bg-rose-600 text-white shadow-sm transition">🌸 Mãe</button>
                    <button type="button" id="btnSeletorPai" onclick="definirResponsavelSelecao('pai')" class="px-3 py-1 rounded-lg text-xs font-bold bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 transition">👔 Pai</button>
                </div>
            </div>

            <!-- ESTATÍSTICAS BEM PEQUENINAS -->
            <div class="grid grid-cols-4 gap-1">
                <div class="bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900/50 p-1 rounded-lg text-center">
                    <p class="text-[8px] font-semibold text-rose-600 dark:text-rose-400 uppercase">Mês Mãe</p>
                    <p id="countMae" class="text-xs font-bold text-rose-700 dark:text-rose-300">0</p>
                </div>
                <div class="bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-900/50 p-1 rounded-lg text-center">
                    <p class="text-[8px] font-semibold text-blue-600 dark:text-blue-400 uppercase">Mês Pai</p>
                    <p id="countPai" class="text-xs font-bold text-blue-700 dark:text-blue-300">0</p>
                </div>
                <div class="bg-rose-50/70 dark:bg-rose-950/20 border border-rose-100 dark:border-rose-900/30 p-1 rounded-lg text-center">
                    <p class="text-[8px] font-semibold text-rose-600 dark:text-rose-400 uppercase">Ano Mãe</p>
                    <p id="countMaeAno" class="text-xs font-bold text-rose-700 dark:text-rose-300">0</p>
                </div>
                <div class="bg-blue-50/70 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-900/30 p-1 rounded-lg text-center">
                    <p class="text-[8px] font-semibold text-blue-600 dark:text-blue-400 uppercase">Ano Pai</p>
                    <p id="countPaiAno" class="text-xs font-bold text-blue-700 dark:text-blue-300">0</p>
                </div>
            </div>

            <div class="text-center text-[9px] font-medium text-gray-500 dark:text-gray-400 pt-0.5">
                💡 Clica e arrasta o dedo pelo calendário para preencher os dias rapidamente!
            </div>
        </div>

        <!-- CALENDÁRIO COM TÍTULO BEM GRANDÃO E NAVEGAÇÃO DIRETA -->
        <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-2.5">
            <div class="flex justify-between items-center px-1">
                <button onclick="mudarMes(-1)" class="px-2.5 py-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg text-xs font-bold transition hover:bg-gray-200">‹ Ant</button>
                <h2 id="tituloCalendarioMes" class="text-base sm:text-lg font-extrabold text-gray-900 dark:text-white">Setembro 2026</h2>
                <button onclick="mudarMes(1)" class="px-2.5 py-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg text-xs font-bold transition hover:bg-gray-200">Próx ›</button>
            </div>

            <div id="calendarioGrid" class="grid grid-cols-7 gap-1 w-full" onmouseup="pararArrasto()" ontouchend="pararArrasto()"></div>
            <div id="textoRegraMes" class="p-2.5 bg-gray-50 dark:bg-gray-900/50 border border-gray-100 dark:border-gray-700 rounded-xl text-[11px] text-gray-700 dark:text-gray-300 leading-relaxed"></div>
        </div>

        <!-- BOTÃO DE IMPRESSÃO / PDF COLORIDO -->
        <div class="text-center pb-4">
            <button onclick="gerarAnoAtualPDF()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-xl transition text-xs shadow-sm flex items-center justify-center gap-1.5">
                📄 Imprimir Calendário Colorido
            </button>
        </div>
    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div id="customModal" class="fixed inset-0 z-50 bg-gray-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div id="modalBoxContent" class="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-2xl max-w-sm w-full space-y-4 border border-gray-100 dark:border-gray-700"></div>
    </div>

    <!-- BARRA INFERIOR COM TEMA E MICROFONE -->
    <div class="fixed bottom-0 left-0 right-0 z-40 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 px-4 py-2 flex justify-between items-center max-w-lg mx-auto rounded-t-2xl shadow-lg">
        <div class="flex items-center gap-2">
            <button onclick="alternarDarkMode()" class="px-2.5 py-1.5 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 text-xs font-medium transition flex items-center gap-1" title="Mudar Luz de Fundo">
                🌙/☀️ Tema
            </button>
            <button onclick="bloquearNovamente()" class="px-2.5 py-1.5 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 text-xs font-medium transition flex items-center gap-1" title="Sair">
                🔒 Sair
            </button>
        </div>
        <!-- MICROFONE -->
        <button onclick="ouvirVoz()" id="btn-voz-flutuante" class="bg-red-600 hover:bg-red-700 text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center text-lg transition transform hover:scale-105 active:scale-95" title="Falar Comando">
            🎤
        </button>
    </div>

    <!-- LÓGICA DA SOPHIA -->
    <script>
        const SENHA_MESTRA = "1510";
        let anoAtual = 2026;
        let mesAtual = 8;
        const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        
        let responsavelAtual = 'mae'; // 'mae' ou 'pai' para o arraste
        let estaAArrastar = false;

        let overrides = {};
        try {
            const salvo = localStorage.getItem('sophia_overrides_all');
            if (salvo) overrides = JSON.parse(salvo);
        } catch(e) {}

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('autenticado_calendario') === 'true') {
                liberarAcesso();
            }
            if (localStorage.getItem('dark_mode') === 'true') {
                document.documentElement.classList.add('dark');
            }
        });

        function verificarLogin(e) {
            e.preventDefault();
            const senhaDigitada = document.getElementById('input-senha').value;
            const erroEl = document.getElementById('erro-senha');

            if (senhaDigitada === SENHA_MESTRA) {
                sessionStorage.setItem('autenticado_calendario', 'true');
                liberarAcesso();
            } else {
                erroEl.classList.remove('hidden');
                document.getElementById('input-senha').value = '';
                document.getElementById('input-senha').focus();
            }
        }

        async function entrarComBiometria() {
            if (!window.PublicKeyCredential) {
                alert("O seu navegador não suporta autenticação biométrica.");
                return;
            }
            try {
                const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                if (!available) {
                    alert("Nenhum leitor biométrico encontrado neste aparelho.");
                    return;
                }

                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);
                const userId = new Uint8Array(16);
                window.crypto.getRandomValues(userId);

                const createCredentialOptions = {
                    challenge: challenge,
                    rp: { name: "Guarda Sophia", id: window.location.hostname },
                    user: { id: userId, name: "sophia@guarda.local", displayName: "Mariana" },
                    pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
                    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "preferred" },
                    timeout: 60000
                };

                let cred;
                const credentialIdStr = localStorage.getItem('biometria_cred_id_cal');

                if (credentialIdStr) {
                    try {
                        const rawId = Uint8Array.from(atob(credentialIdStr), c => c.charCodeAt(0));
                        cred = await navigator.credentials.get({ challenge, allowCredentials: [{ id: rawId, type: "public-key" }], userVerification: "required", timeout: 60000 });
                    } catch (err) {
                        cred = await navigator.credentials.create({ publicKey: createCredentialOptions });
                        localStorage.setItem('biometria_cred_id_cal', btoa(String.fromCharCode.apply(null, new Uint8Array(cred.rawId))));
                    }
                } else {
                    cred = await navigator.credentials.create({ publicKey: createCredentialOptions });
                    localStorage.setItem('biometria_cred_id_cal', btoa(String.fromCharCode.apply(null, new Uint8Array(cred.rawId))));
                }

                if (cred) {
                    sessionStorage.setItem('autenticado_calendario', 'true');
                    liberarAcesso();
                }
            } catch (error) {
                alert("Biometria cancelada ou não configurada. Podes usar a senha PIN (1510).");
            }
        }

        function liberarAcesso() {
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('conteudo-site').classList.remove('hidden');
            renderizar();
        }

        function bloquearNovamente() {
            sessionStorage.removeItem('autenticado_calendario');
            document.getElementById('conteudo-site').classList.add('hidden');
            document.getElementById('tela-login').classList.remove('hidden');
            document.getElementById('input-senha').value = '';
            document.getElementById('erro-senha').classList.add('hidden');
        }

        function alternarDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('dark_mode', isDark);
        }

        function definirResponsavelSelecao(resp) {
            responsavelAtual = resp;
            const btnMae = document.getElementById('btnSeletorMae');
            const btnPai = document.getElementById('btnSeletorPai');
            if (resp === 'mae') {
                btnMae.className = "px-3 py-1 rounded-lg text-xs font-bold bg-rose-600 text-white shadow-sm transition";
                btnPai.className = "px-3 py-1 rounded-lg text-xs font-bold bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 transition";
            } else {
                btnPai.className = "px-3 py-1 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-sm transition";
                btnMae.className = "px-3 py-1 rounded-lg text-xs font-bold bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 transition";
            }
        }

        // SISTEMA DE ARRASTE NO CALENDÁRIO
        function iniciarArrasto(ano, mes, dia) {
            estaAArrastar = true;
            aplicarResponsavelDia(ano, mes, dia);
        }

        function arrastarSobreDia(ano, mes, dia) {
            if (estaAArrastar) {
                aplicarResponsavelDia(ano, mes, dia);
            }
        }

        function pararArrasto() {
            if (estaAArrastar) {
                estaAArrastar = false;
                renderizar();
            }
        }

        function aplicarResponsavelDia(ano, mes, dia) {
            const chave = `${ano}-${mes}-${dia}`;
            const desc = responsavelAtual === 'mae' ? 'Mãe' : 'Pai';
            overrides[chave] = { resp: responsavelAtual, desc: desc };
            try { localStorage.setItem('sophia_overrides_all', JSON.stringify(overrides)); } catch(e) {}
            renderizar();
        }

        // MICROFONE INTELIGENTE
        function ouvirVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("O seu navegador não suporta reconhecimento de voz.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            const btnFloat = document.getElementById('btn-voz-flutuante');

            recognition.onstart = () => { btnFloat.classList.add('animate-pulse', 'bg-amber-500'); };
            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript.toLowerCase();
                if (texto.includes('mãe') || texto.includes('mae')) {
                    definirResponsavelSelecao('mae');
                    alert("Selecionado: Mãe! Podes passar o dedo no calendário.");
                } else if (texto.includes('pai')) {
                    definirResponsavelSelecao('pai');
                    alert("Selecionado: Pai! Podes passar o dedo no calendário.");
                } else {
                    alert(`Comando de voz: "${texto}"`);
                }
            };
            recognition.onerror = () => { btnFloat.classList.remove('animate-pulse', 'bg-amber-500'); };
            recognition.onend = () => { btnFloat.classList.remove('animate-pulse', 'bg-amber-500'); };
            recognition.start();
        }

        function editarDia(ano, mes, dia) {
            const modal = document.getElementById('customModal');
            const box = document.getElementById('modalBoxContent');
            
            box.innerHTML = `
                <h3 class="text-sm font-bold text-gray-900 dark:text-white mb-2">✏️ Editar Dia ${dia}/${mes+1}/${ano}</h3>
                <select id="selectResp" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border rounded-xl text-xs mb-2 dark:text-white">
                    <option value="mae">Mãe</option>
                    <option value="pai">Pai</option>
                </select>
                <input type="text" id="inputDesc" placeholder="Descrição (ex: Férias, Viagem)" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border rounded-xl text-xs mb-3 dark:text-white">
                <div class="flex gap-2">
                    <button onclick="salvarEdicao(${ano}, ${mes}, ${dia})" class="flex-1 bg-green-600 text-white py-2 rounded-xl text-xs font-bold">Salvar</button>
                    <button onclick="apagarEdicao(${ano}, ${mes}, ${dia})" class="flex-1 bg-red-600 text-white py-2 rounded-xl text-xs font-bold">Apagar</button>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function salvarEdicao(ano, mes, dia) {
            const chave = `${ano}-${mes}-${dia}`;
            const resp = document.getElementById('selectResp').value;
            const desc = document.getElementById('inputDesc').value || (resp === 'mae' ? 'Mãe' : 'Pai');
            
            overrides[chave] = { resp: resp, desc: desc };
            try { localStorage.setItem('sophia_overrides_all', JSON.stringify(overrides)); } catch(e) {}
            
            fecharModal();
            renderizar();
        }

        function apagarEdicao(ano, mes, dia) {
            const chave = `${ano}-${mes}-${dia}`;
            delete overrides[chave];
            try { localStorage.setItem('sophia_overrides_all', JSON.stringify(overrides)); } catch(e) {}
            
            fecharModal();
            renderizar();
        }

        function fecharModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        const feriados = {
            "0-1": "Confraternização", "3-21": "Tiradentes", "4-1": "Trabalho",
            "8-7": "Independência", "9-12": "Aparecida", "10-2": "Finados",
            "10-15": "Proclamação", "11-25": "Natal"
        };

        function regraPadrao(dia, mes, ano) {
            const chave = `${ano}-${mes}-${dia}`;
            if (overrides[chave]) return overrides[chave];

            const data = new Date(ano, mes, dia);
            const ds = data.getDay();
            let sexta = dia;
            if (ds === 6) sexta = dia - 1;
            if (ds === 0) sexta = dia - 2;
            if ((ds === 5 || ds === 6 || ds === 0) && sexta > 0) {
                const numSexta = Math.ceil(sexta / 7);
                if (numSexta === 2 || numSexta === 4) return { resp: 'pai', desc: 'Pai' };
            }
            return { resp: 'mae', desc: 'Mãe' };
        }

        function renderizar() {
            if (anoAtual < 2026) { anoAtual = 2026; mesAtual = 0; }
            if (anoAtual > 2027) { anoAtual = 2027; mesAtual = 11; }

            document.getElementById('tituloCalendarioMes').innerText = `${nomesMeses[mesAtual]} ${anoAtual}`;
            
            const grid = document.getElementById('calendarioGrid');
            grid.innerHTML = '';
            ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].forEach(d => {
                const div = document.createElement('div');
                div.className = 'text-center font-bold text-[10px] text-gray-400 uppercase py-1';
                div.innerText = d;
                grid.appendChild(div);
            });

            const primeiroDia = new Date(anoAtual, mesAtual, 1).getDay();
            const totalDias = new Date(anoAtual, mesAtual + 1, 0).getDate();

            for (let i = 0; i < primeiroDia; i++) {
                const vazio = document.createElement('div');
                vazio.className = 'min-h-[45px] rounded-lg opacity-20 bg-gray-100 dark:bg-gray-800';
                grid.appendChild(vazio);
            }

            let totalMaeMes = 0;
            let totalPaiMes = 0;

            for (let dia = 1; dia <= totalDias; dia++) {
                const info = regraPadrao(dia, mesAtual, anoAtual);
                const feriadoNome = feriados[`${mesAtual}-${dia}`];
                
                if (info.resp === 'mae') totalMaeMes++;
                else if (info.resp === 'pai') totalPaiMes++;

                const cell = document.createElement('div');
                
                let bgClass = info.resp === 'mae' ? 'bg-rose-100 dark:bg-rose-950/70 border-rose-300 dark:border-rose-800' : 'bg-blue-100 dark:bg-blue-950/70 border-blue-300 dark:border-blue-800';
                let textClass = info.resp === 'mae' ? 'text-rose-800 dark:text-rose-200' : 'text-blue-800 dark:text-blue-200';
                let badgeClass = info.resp === 'mae' ? 'bg-rose-200 dark:bg-rose-900 text-rose-900 dark:text-rose-100' : 'bg-blue-200 dark:bg-blue-900 text-blue-900 dark:text-blue-100';

                cell.className = `min-h-[55px] rounded-xl border-2 p-1 flex flex-col justify-between relative transition cursor-pointer select-none ${bgClass}`;
                
                cell.onmousedown = () => iniciarArrasto(anoAtual, mesAtual, dia);
                cell.onmouseenter = () => arrastarSobreDia(anoAtual, mesAtual, dia);
                cell.ontouchstart = (e) => { e.preventDefault(); iniciarArrasto(anoAtual, mesAtual, dia); };
                cell.ontouchmove = (e) => {
                    let touch = e.touches[0];
                    let target = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (target && target.dataset && target.dataset.ano) {
                        arrastarSobreDia(parseInt(target.dataset.ano), parseInt(target.dataset.mes), parseInt(target.dataset.dia));
                    }
                };
                cell.dataset.ano = anoAtual;
                cell.dataset.mes = mesAtual;
                cell.dataset.dia = dia;

                let badgesHtml = '';
                if (feriadoNome) badgesHtml += `<span class="text-[7px] bg-emerald-200 text-emerald-900 dark:bg-emerald-900 dark:text-emerald-100 px-1 rounded truncate text-center font-bold block mb-0.5">${feriadoNome}</span>`;
                
                badgesHtml += `<span class="text-[9px] px-1 rounded truncate text-center font-bold block ${badgeClass}">${info.desc}</span>`;
                
                cell.innerHTML = `
                    <div class="text-[11px] font-extrabold ${textClass}">${dia}</div>
                    <div class="flex flex-col gap-0.5">${badgesHtml}</div>
                `;
                grid.appendChild(cell);
            }

            document.getElementById('countMae').innerText = `${totalMaeMes} dias`;
            document.getElementById('countPai').innerText = `${totalPaiMes} dias`;

            let totalMaeAno = 0;
            let totalPaiAno = 0;
            for (let m = 0; m < 12; m++) {
                const diasDoMes = new Date(anoAtual, m + 1, 0).getDate();
                for (let d = 1; d <= diasDoMes; d++) {
                    const inf = regraPadrao(d, m, anoAtual);
                    if (inf.resp === 'mae') totalMaeAno++;
                    else if (inf.resp === 'pai') totalPaiAno++;
                }
            }
            document.getElementById('countMaeAno').innerText = `${totalMaeAno} dias`;
            document.getElementById('countPaiAno').innerText = `${totalPaiAno} dias`;
        }

        function mudarMes(delta) {
            mesAtual += delta;
            if (mesAtual > 11) { mesAtual = 0; anoAtual++; } 
            else if (mesAtual < 0) { mesAtual = 11; anoAtual--; }
            renderizar();
        }

        function gerarAnoAtualPDF() {
            window.print();
