<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guarda Compartilhada</title>
    
    <!-- Meta tags PWA para visual nativo no celular -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">

    <link rel="icon" href="https://api.iconify.design/solar:calendar-date-bold-duotone.png?width=512&height=512&color=%233b82f6" type="image/png">
    
    <!-- Fonte moderna Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overscroll-behavior-y: contain; /* Evita recarregar a tela por puxão acidental no celular */
        }

        .day-cell-screen {
            min-height: 42px !important;
            max-height: 50px !important;
            border-color: #cbd5e1 !important;
        }

        @media print {
            body { background: white !important; color: black !important; padding: 0 !important; }
            .print-hidden, #tela-login, .fixed, button, input, select, #toast { display: none !important; }
            #conteudo-site { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            .mes-pagina-impressao { page-break-after: always; break-after: page; padding-bottom: 20px; }
            .day-cell-screen {
                min-height: 65px !important;
                max-height: none !important;
            }
            th { border: 1px solid #cbd5e1 !important; background: #f8fafc !important; }
            td { width: 14.28%; height: 65px; vertical-align: top; border: 1px solid #cbd5e1 !important; border-radius: 8px; padding: 4px; box-sizing: border-box; }
            
            .past-day .day-num { position: relative; }
            .past-day .day-num::after {
                content: "";
                position: absolute;
                left: -4px;
                right: -4px;
                top: 50%;
                height: 1.5px;
                background-color: #000000;
                transform: translateY(-50%);
            }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }

        .past-day .day-num { position: relative; }
        .past-day .day-num::after {
            content: "";
            position: absolute;
            left: -4px;
            right: -4px;
            top: 50%;
            height: 1.5px;
            background-color: #000000;
            transform: translateY(-50%);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen text-gray-800 dark:text-gray-100 transition-colors duration-200 pb-28 select-none font-sans">

    <!-- NOTIFICAÇÃO FLUTUANTE (TOAST) -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-gray-900/95 dark:bg-gray-800/95 text-white text-xs font-semibold px-4 py-2.5 rounded-2xl shadow-xl backdrop-blur-md transition-all duration-300 opacity-0 pointer-events-none -translate-y-2 flex items-center gap-2 border border-gray-700/50"></div>

    <!-- TELA DE LOGIN / CAPA EXCLUSIVA POR BIOMETRIA (SOMENTE CELULAR: md:hidden) -->
    <div id="tela-login" class="fixed inset-0 z-50 bg-gray-900/90 backdrop-blur-sm hidden flex items-center justify-center p-4 md:hidden">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-2xl max-w-xs w-full text-center space-y-5 border border-gray-100 dark:border-gray-700">
            <div class="w-16 h-16 bg-blue-50 dark:bg-blue-950/50 rounded-2xl mx-auto flex items-center justify-center text-3xl">👧</div>
            <div>
                <h2 class="text-xl font-bold text-gray-900 dark:text-white">Acesso por Digital</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Valide sua biometria para abrir</p>
            </div>

            <button type="button" onclick="entrarComBiometria()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3.5 rounded-2xl transition text-sm shadow-md flex items-center justify-center gap-2 cursor-pointer">
                <span class="text-lg">👆</span>
                <span>Validar Digital</span>
            </button>

            <p id="erro-senha" class="text-xs text-red-500 hidden font-medium">Leitura não reconhecida. Tente novamente.</p>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="conteudo-site" class="max-w-lg mx-auto p-2.5 space-y-2.5">
        
        <!-- TÍTULO PRINCIPAL COM STATUS DA NUVEM -->
        <div class="py-1 flex justify-between items-center px-1">
            <div class="flex items-center gap-2">
                <h1 class="text-base sm:text-lg font-extrabold text-gray-900 dark:text-white flex items-center gap-1.5">
                    📅 Guarda Compartilhada
                </h1>
                <!-- INDICADOR DA NUVEM -->
                <div id="statusNuvem" class="flex items-center gap-1 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-400 border border-emerald-200/60 dark:border-emerald-900/50 px-2 py-0.5 rounded-full text-[9px] font-semibold" title="Status da Conexão com Supabase">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="textoStatusNuvem">Nuvem ativa</span>
                </div>
            </div>
            
            <button onclick="sincronizarComNuvem().then(() => mostrarToast('🔄 Sincronizado com a Nuvem!'))" class="print-hidden bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 px-2.5 py-1 rounded-xl text-[10px] font-bold transition active:scale-95" title="Sincronizar com Nuvem">🔄 Sincronizar</button>
        </div>

        <!-- PAINEL SUPERIOR COM CAIXAS COMPACTAS E BARRA DE PROPORÇÃO -->
        <div class="print-hidden bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-2">
            
            <div class="grid grid-cols-2 gap-1.5">
                <div class="bg-rose-50/70 dark:bg-rose-950/30 border border-rose-200/60 dark:border-rose-900/40 px-2.5 py-1.5 rounded-xl flex justify-between items-center">
                    <span class="text-[9px] font-semibold text-rose-600 dark:text-rose-400 uppercase">👩 Mês Mãe</span>
                    <span id="countMae" class="text-xs font-bold text-rose-700 dark:text-rose-300">0 dias</span>
                </div>
                <div class="bg-sky-50/70 dark:bg-sky-950/30 border border-sky-200/60 dark:border-sky-900/40 px-2.5 py-1.5 rounded-xl flex justify-between items-center">
                    <span class="text-[9px] font-semibold text-sky-600 dark:text-sky-400 uppercase">👔 Mês Pai</span>
                    <span id="countPai" class="text-xs font-bold text-sky-700 dark:text-sky-300">0 dias</span>
                </div>
            </div>

            <!-- BARRA DE PROPORÇÃO VISUAL (MÃE X PAI) -->
            <div class="space-y-1">
                <div class="w-full bg-gray-100 dark:bg-gray-700/50 h-2 rounded-full overflow-hidden flex shadow-inner">
                    <div id="barraMae" class="bg-rose-500 transition-all duration-500 h-full" style="width: 50%;"></div>
                    <div id="barraPai" class="bg-sky-500 transition-all duration-500 h-full" style="width: 50%;"></div>
                </div>
                <div class="flex justify-between text-[8px] font-bold text-gray-400 px-0.5">
                    <span id="labelPctMae">50% Mãe</span>
                    <span id="labelPctPai">50% Pai</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-1.5 pt-0.5">
                <div class="bg-rose-50/40 dark:bg-rose-950/20 border border-rose-100 dark:border-rose-900/30 px-2.5 py-1.5 rounded-xl flex justify-between items-center">
                    <span class="text-[9px] font-semibold text-rose-600 dark:text-rose-400 uppercase">👩 Ano Mãe</span>
                    <span id="countMaeAno" class="text-xs font-bold text-rose-700 dark:text-rose-300">0 dias</span>
                </div>
                <div class="bg-sky-50/40 dark:bg-sky-950/20 border border-sky-100 dark:border-sky-900/30 px-2.5 py-1.5 rounded-xl flex justify-between items-center">
                    <span class="text-[9px] font-semibold text-sky-600 dark:text-sky-400 uppercase">👔 Ano Pai</span>
                    <span id="countPaiAno" class="text-xs font-bold text-sky-700 dark:text-sky-300">0 dias</span>
                </div>
            </div>

        </div>

        <!-- CALENDÁRIO COM GESTOS DE TOQUE (SWIPE) -->
        <div id="bloco-calendario-print" class="bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-2.5">
            <div class="flex justify-between items-center px-1">
                <button onclick="mudarMes(-1)" class="print-hidden px-2.5 py-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg text-xs font-bold transition hover:bg-gray-200 dark:hover:bg-gray-600 active:scale-95">‹ Ant</button>
                
                <div class="flex items-center gap-1.5">
                    <h2 id="tituloCalendarioMes" class="text-base sm:text-lg font-extrabold text-gray-900 dark:text-white">Setembro 2026</h2>
                    <button onclick="irParaHoje()" class="print-hidden px-1.5 py-0.5 bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-900/60 rounded-md text-[9px] font-bold active:scale-95 transition" title="Ir para o Mês Atual">Hoje</button>
                </div>

                <button onclick="mudarMes(1)" class="print-hidden px-2.5 py-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg text-xs font-bold transition hover:bg-gray-200 dark:hover:bg-gray-600 active:scale-95">Próx ›</button>
            </div>

            <div id="calendarioGrid" class="grid grid-cols-7 gap-1 w-full"></div>
            <div id="textoRegraMes" class="print-hidden p-2.5 bg-gray-50 dark:bg-gray-900/50 border border-gray-100 dark:border-gray-700 rounded-xl text-[11px] text-gray-700 dark:text-gray-300 leading-relaxed"></div>
        </div>

        <!-- BOTÕES DE EXPORTAÇÃO E COMPARTILHAMENTO -->
        <div class="print-hidden grid grid-cols-2 gap-2 pb-1">
            <button onclick="gerenarAnoCompletoPDF()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-2.5 rounded-xl transition text-xs shadow-md flex items-center justify-center gap-1.5 active:scale-95">
                <span>📄</span> Imprimir em PDF
            </button>
            <button onclick="compartilharResumoWhatsApp()" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-semibold py-2.5 rounded-xl transition text-xs shadow-md flex items-center justify-center gap-1.5 active:scale-95">
                <span>💬</span> Copiar WhatsApp
            </button>
        </div>

        <!-- BLOCO DE SELEÇÃO DE PERÍODO -->
        <div class="print-hidden bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-1.5">
            <div class="flex justify-between items-center">
                <p class="text-[9px] font-bold text-gray-700 dark:text-gray-300 uppercase">✨ Selecionar Período</p>
                <button onclick="abrirGerenciadorMotivos()" class="text-[10px] text-blue-600 dark:text-blue-400 font-bold hover:underline flex items-center gap-1">
                    ⚙️ Gerenciar Motivos
                </button>
            </div>
            
            <div class="grid grid-cols-12 gap-1 items-center">
                <div class="col-span-3">
                    <select id="respPeriodo" class="w-full bg-white dark:bg-gray-800 text-[10px] p-1.5 border rounded-xl dark:border-gray-700 dark:text-white font-bold focus:ring-1 focus:ring-blue-500">
                        <option value="mae">👩 Mãe</option>
                        <option value="pai">👔 Pai</option>
                    </select>
                </div>
                <div class="col-span-4">
                    <input type="date" id="dataInicio" class="w-full bg-white dark:bg-gray-800 text-[10px] p-1.5 border rounded-xl dark:border-gray-700 dark:text-white focus:ring-1 focus:ring-blue-500">
                </div>
                <div class="col-span-4">
                    <input type="date" id="dataFim" class="w-full bg-white dark:bg-gray-800 text-[10px] p-1.5 border rounded-xl dark:border-gray-700 dark:text-white focus:ring-1 focus:ring-blue-500">
                </div>
                <div class="col-span-1 flex justify-center">
                    <button onclick="aplicarPeriodo()" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-2 py-1.5 rounded-xl text-[10px] font-bold shadow-sm">Ok</button>
                </div>
            </div>

            <!-- SELEÇÃO DE MOTIVO -->
            <div class="grid grid-cols-12 gap-1 items-center pt-1">
                <div class="col-span-6">
                    <select id="selectMotivo" onchange="verificarMotivoOutros()" class="w-full bg-white dark:bg-gray-800 text-[10px] p-1.5 border rounded-xl dark:border-gray-700 dark:text-white focus:ring-1 focus:ring-blue-500">
                    </select>
                </div>
                <div class="col-span-6" id="divOutros" style="display: none;">
                    <input type="text" id="descOutros" placeholder="Digite o motivo..." class="w-full bg-white dark:bg-gray-800 text-[10px] p-1.5 border rounded-xl dark:border-gray-700 dark:text-white focus:ring-1 focus:ring-blue-500">
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL DE EDIÇÃO DO DIA -->
    <div id="customModal" onclick="if(event.target === this) fecharModal()" class="fixed inset-0 z-50 bg-gray-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div id="modalBoxContent" class="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-2xl max-w-sm w-full space-y-4 border border-gray-100 dark:border-gray-700 relative"></div>
    </div>

    <!-- MODAL DE GERENCIAR MOTIVOS -->
    <div id="modalMotivos" onclick="if(event.target === this) fecharModalMotivos()" class="fixed inset-0 z-50 bg-gray-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-2xl max-w-sm w-full space-y-3 border border-gray-100 dark:border-gray-700 relative">
            <div class="flex justify-between items-center pb-1 border-b border-gray-100 dark:border-gray-700">
                <h3 class="text-xs font-bold text-gray-900 dark:text-white flex items-center gap-1.5">
                    ⚙️ Cadastrar e Modificar Motivos
                </h3>
                <button onclick="fecharModalMotivos()" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 rounded-full flex items-center justify-center font-bold text-xs">✕</button>
            </div>
            
            <div class="flex gap-1.5">
                <input type="text" id="novoMotivoInput" placeholder="Novo motivo (ex: Viagem, Consulta)" class="flex-1 px-3 py-1.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-xs dark:text-white">
                <button onclick="adicionarMotivoPersonalizado()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold active:scale-95">Adicionar</button>
            </div>

            <div class="space-y-1 max-h-48 overflow-y-auto pr-1" id="listaMotivosGerenciar"></div>
        </div>
    </div>

    <!-- BARRA INFERIOR -->
    <div class="print-hidden fixed bottom-0 left-0 right-0 z-40 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 px-3 py-1.5 flex justify-between items-center max-w-lg mx-auto rounded-t-2xl shadow-lg">
        <div class="flex items-center gap-1.5">
            <button onclick="alternarDarkMode()" class="px-2.5 py-1.5 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 text-xs font-medium transition flex items-center gap-1 active:scale-95" title="Modo Escuro/Claro">
                🌙/☀️
            </button>
            <button onclick="instalarApp()" class="px-2.5 py-1.5 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-700 dark:text-blue-300 text-xs font-bold transition flex items-center gap-1 active:scale-95" title="Instalar App no Celular">
                📱 Instalar
            </button>
            <button onclick="bloquearNovamente()" class="px-2.5 py-1.5 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 text-xs font-medium transition flex items-center gap-1 md:hidden active:scale-95" title="Bloquear Celular">
                🔒 Bloquear
            </button>
            <span class="text-[10px] font-bold text-gray-400 dark:text-gray-500 ml-1">v3.0</span>
        </div>
        <button onclick="ouvirVoz()" id="btn-voz-flutuante" class="bg-red-600 hover:bg-red-700 text-white w-9 h-9 rounded-full shadow-md flex items-center justify-center text-base transition transform hover:scale-105 active:scale-95 flex-shrink-0" title="Falar Comando">
            🎤
        </button>
    </div>

    <script>
        const SUPABASE_URL = 'https://jmeepzdvmmjngxwvayqb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_54ORrLbP7naW7n-KlKCdUA_hZnpjguH';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let hojeReal = new Date();
        let anoAtual = 2026;
        let mesAtual = 8;
        const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        let deferredPrompt = null;
        let overrides = {};

        // LISTA DE MOTIVOS (COM OPÇÕES DE TROCA E COMPENSAÇÃO)
        const motivosPadrao = ["Férias", "Final de Ano", "Aniversário Pai", "Aniversário Mãe", "Troca de Dia", "Compensação"];
        let listaMotivos = [...motivosPadrao];

        // FEEDBACK TÁTIL (HAPTIC)
        function vibrar(ms = 15) {
            if (navigator.vibrate) {
                try { navigator.vibrate(ms); } catch (e) {}
            }
        }

        // AVISOS FLUTUANTES (TOAST)
        function mostrarToast(mensagem) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = mensagem;
            toast.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none');
            }, 2600);
        }

        function irParaHoje() {
            vibrar(10);
            anoAtual = hojeReal.getFullYear();
            mesAtual = hojeReal.getMonth();
            renderizar();
            mostrarToast(`📅 Exibindo ${nomesMeses[mesAtual]} de ${anoAtual}`);
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function instalarApp() {
            vibrar();
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
            } else {
                alert("📱 Para instalar no celular:\n\n• No Android (Chrome): Toque nos 3 pontinhos do canto superior direito e selecione 'Adicionar à tela inicial'.\n• No iPhone (Safari): Toque no botão de Compartilhar e selecione 'Adicionar à Tela de Início'.");
            }
        }

        function setStatusNuvem(conectado, texto = null) {
            const el = document.getElementById('statusNuvem');
            const txt = document.getElementById('textoStatusNuvem');
            if (!el || !txt) return;

            if (conectado) {
                el.className = "flex items-center gap-1 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-400 border border-emerald-200/60 dark:border-emerald-900/50 px-2 py-0.5 rounded-full text-[9px] font-semibold";
                txt.innerText = texto || "Nuvem ativa";
            } else {
                el.className = "flex items-center gap-1 bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-400 border border-amber-200/60 dark:border-amber-900/50 px-2 py-0.5 rounded-full text-[9px] font-semibold";
                txt.innerText = texto || "Offline (Local)";
            }
        }

        async function sincronizarComNuvem() {
            try {
                let { data, error } = await supabaseClient
                    .from('app_dados_guarda')
                    .select('conteudo')
                    .eq('id', '1')
                    .single();

                if (!error && data && data.conteudo) {
                    if (data.conteudo.overrides) {
                        overrides = data.conteudo.overrides;
                        listaMotivos = data.conteudo.motivos || [...motivosPadrao];
                    } else {
                        overrides = data.conteudo;
                    }
                    localStorage.setItem('sophia_overrides_all', JSON.stringify(overrides));
                    localStorage.setItem('sophia_motivos_list', JSON.stringify(listaMotivos));
                    setStatusNuvem(true, "Nuvem ativa");
                } else {
                    carregarCacheLocal();
                }
            } catch(e) {
                carregarCacheLocal();
            }
            atualizarSelectMotivos();
            renderizar();
        }

        function carregarCacheLocal() {
            let salvo = localStorage.getItem('sophia_overrides_all');
            if (salvo) overrides = JSON.parse(salvo);
            let motivosSalvos = localStorage.getItem('sophia_motivos_list');
            if (motivosSalvos) listaMotivos = JSON.parse(motivosSalvos);
            setStatusNuvem(false, "Offline (Local)");
        }

        async function salvarNaNuvem() {
            localStorage.setItem('sophia_overrides_all', JSON.stringify(overrides));
            localStorage.setItem('sophia_motivos_list', JSON.stringify(listaMotivos));
            try {
                let { error } = await supabaseClient
                    .from('app_dados_guarda')
                    .upsert({ 
                        id: '1', 
                        conteudo: { 
                            overrides: overrides, 
                            motivos: listaMotivos 
                        } 
                    });
                if (!error) {
                    setStatusNuvem(true, "Nuvem ativa");
                } else {
                    setStatusNuvem(false, "Salvo local");
                }
            } catch (err) {
                setStatusNuvem(false, "Salvo local");
            }
        }

        function atualizarSelectMotivos() {
            const select = document.getElementById('selectMotivo');
            if (!select) return;
            const valorAtual = select.value;
            select.innerHTML = '';
            
            listaMotivos.forEach(motivo => {

        async function entrarComBiometria() {
            const erroEl = document.getElementById('erro-senha');
            erroEl.classList.add('hidden');

            if (!window.PublicKeyCredential) {
                erroEl.innerText = "Biometria indisponível neste navegador.";
                erroEl.classList.remove('hidden');
                return;
            }
            try {
                const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                if (!available) {
                    erroEl.innerText = "Nenhuma biometria ativa configurada no aparelho.";
                    erroEl.classList.remove('hidden');
                    return;
                }

                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);
                const userId = new Uint8Array(16);
                window.crypto.getRandomValues(userId);

                const createCredentialOptions = {
                    challenge: challenge,
                    rp: { name: "Guarda Compartilhada", id: window.location.hostname },
                    user: { id: userId, name: "guarda@local", displayName: "Usuário" },
                    pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
                    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "preferred" },
                    timeout: 60000
                };

                let cred;
                const credentialIdStr = localStorage.getItem('biometria_cred_id_cal');

                if (credentialIdStr) {
                    try {
                        const rawId = Uint8Array.from(atob(credentialIdStr), c => c.charCodeAt(0));
                        cred = await navigator.credentials.get({ challenge, allowCredentials: [{ id: rawId, type: "public-key" }], userVerification: "required", timeout: 60000 });
                    } catch (err) {
                        cred = await navigator.credentials.create({ publicKey: createCredentialOptions });
                        localStorage.setItem('biometria_cred_id_cal', btoa(String.fromCharCode.apply(null, new Uint8Array(cred.rawId))));
                    }
                } else {
                    cred = await navigator.credentials.create({ publicKey: createCredentialOptions });
                    localStorage.setItem('biometria_cred_id_cal', btoa(String.fromCharCode.apply(null, new Uint8Array(cred.rawId))));
                }

                if (cred) {
                    vibrar(25);
                    sessionStorage.setItem('autenticado_calendario', 'true');
                    liberarAcesso();
                }
            } catch (error) {
                if (error.name !== "NotAllowedError") {
                    erroEl.innerText = "Falha biométrica. Tente novamente.";
                    erroEl.classList.remove('hidden');
                }
            }
        }

        // GESTOS DE ARRASTAR (SWIPE) NO CELULAR
        function configurarGestosSwipe() {
            const container = document.getElementById('bloco-calendario-print');
            let touchStartX = 0;
            let touchEndX = 0;

            container.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) > 45) { // deslize mínimo de 45px
                    if (diff < 0) {
                        mudarMes(1); // Deslizar p/ esquerda = próximo
                    } else {
                        mudarMes(-1); // Deslizar p/ direita = anterior
                    }
                }
            }, { passive: true });
        }

        function aplicarPeriodo() {
            vibrar();
            const inicioStr = document.getElementById('dataInicio').value;
            const fimStr = document.getElementById('dataFim').value;
            const resp = document.getElementById('respPeriodo').value;
            
            const selectMotivo = document.getElementById('selectMotivo').value;
            let desc = selectMotivo;
            if (selectMotivo === 'Outros') {
                desc = document.getElementById('descOutros').value.trim() || (resp === 'mae' ? 'Mãe' : 'Pai');
            }

            if (!inicioStr || !fimStr) {
                mostrarToast("⚠️ Selecione as datas de Início e Fim.");
                return;
            }

            let dInicio = new Date(inicioStr + 'T00:00:00');
            let dFim = new Date(fimStr + 'T00:00:00');

            if (dInicio > dFim) {
                mostrarToast("⚠️ Data inicial posterior à final.");
                return;
            }

            let atual = new Date(dInicio);
            while (atual <= dFim) {
                let y = atual.getFullYear();
                let m = atual.getMonth();
                let d = atual.getDate();
                let chave = `${y}-${m}-${d}`;
                overrides[chave] = { resp: resp, desc: desc };
                atual.setDate(atual.getDate() + 1);
            }

            salvarNaNuvem();
            mostrarToast("✨ Período aplicado e sincronizado!");
            renderizar();
        }

        function ouvirVoz() {
            vibrar();
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                mostrarToast("Microfone não suportado no navegador.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            const btnFloat = document.getElementById('btn-voz-flutuante');

            recognition.onstart = () => { 
                btnFloat.classList.add('animate-pulse', 'bg-amber-500'); 
                mostrarToast("🎙️ Ouvindo comando de voz...");
            };
            
            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript.toLowerCase();
                
                if (texto.includes('próximo') || texto.includes('proximo')) {
                    mudarMes(1);
                    return;
                } else if (texto.includes('anterior')) {
                    mudarMes(-1);
                    return;
                }

                let respDetectada = null;
                if (texto.includes('mãe') || texto.includes('mae')) {
                    respDetectada = 'mae';
                    document.getElementById('respPeriodo').value = 'mae';
                } else if (texto.includes('pai')) {
                    respDetectada = 'pai';
                    document.getElementById('respPeriodo').value = 'pai';
                }

                const numeros = texto.match(/\d+/g);
                if (numeros && numeros.length >= 2 && respDetectada) {
                    let diaIni = parseInt(numeros[0]);
                    let diaFim = parseInt(numeros[1]);

                    if (diaIni > diaFim) { let temp = diaIni; diaIni = diaFim; diaFim = temp; }

                    let desc = document.getElementById('selectMotivo').value;
                    if (desc === 'Outros') {
                        desc = document.getElementById('descOutros').value || (respDetectada === 'mae' ? 'Mãe' : 'Pai');
                    }

                    for (let d = diaIni; d <= diaFim; d++) {
                        let chave = `${anoAtual}-${mesAtual}-${d}`;
                        overrides[chave] = { resp: respDetectada, desc: desc };
                    }

                    salvarNaNuvem();
                    renderizar();
                    vibrar(20);
                    mostrarToast(`🎤 Dias ${diaIni} a ${diaFim} salvos para ${respDetectada === 'mae' ? 'Mãe' : 'Pai'}!`);
                } else {
                    mostrarToast(`Ouvido: "${texto}". Ex: "18 a 19 mãe"`);
                }
            };

            recognition.onerror = () => { btnFloat.classList.remove('animate-pulse', 'bg-amber-500'); };
            recognition.onend = () => { btnFloat.classList.remove('animate-pulse', 'bg-amber-500'); };
            recognition.start();
        }

        function regraPadrao(dia, mes, ano) {
            const chave = `${ano}-${mes}-${dia}`;
            if (overrides[chave]) return overrides[chave];

            const chaveMes = `${ano}-${mes}`;
            if (regrasEspeciais[chaveMes]) {
                for (let regra of regrasEspeciais[chaveMes]) {
                    if (dia >= regra.d[0] && dia <= regra.d[1]) {
                        return { resp: regra.resp, desc: regra.desc };
                    }
                }
            }

            // Regra geral de fins de semana (2º e 4º finais de semana com o Pai)
            const data = new Date(ano, mes, dia);
            const ds = data.getDay();
            let sexta = dia;
            if (ds === 6) sexta = dia - 1;
            if (ds === 0) sexta = dia - 2;
            if ((ds === 5 || ds === 6 || ds === 0) && sexta > 0) {
                const numSexta = Math.ceil(sexta / 7);
                if (numSexta === 2 || numSexta === 4) return { resp: 'pai', desc: 'Pai' };
            }
            return { resp: 'mae', desc: 'Mãe' };
        }

            const chaveRegra = `${anoAtual}-${mesAtual}`;
            document.getElementById('textoRegraMes').innerHTML = regrasPorAnoMes[chaveRegra] || `<b>${nomesMeses[mesAtual]} ${anoAtual}:</b> Guarda Compartilhada.`;

            const grid = document.getElementById('calendarioGrid');
            grid.innerHTML = '';
            ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].forEach(d => {
                const div = document.createElement('div');
                div.className = 'text-center font-bold text-[10px] text-gray-400 uppercase py-1';
                div.innerText = d;
                grid.appendChild(div);
            });

            const primeiroDia = new Date(anoAtual, mesAtual, 1).getDay();
            const totalDias = new Date(anoAtual, mesAtual + 1, 0).getDate();

            for (let i = 0; i < primeiroDia; i++) {
                const vazio = document.createElement('div');
                vazio.className = 'day-cell-screen rounded-lg opacity-20 bg-gray-100 dark:bg-gray-800';
                grid.appendChild(vazio);
            }

            const dataHoje = new Date(hojeReal.getFullYear(), hojeReal.getMonth(), hojeReal.getDate());

            let totalMaeMes = 0;
            let totalPaiMes = 0;

            for (let dia = 1; dia <= totalDias; dia++) {
                const info = regraPadrao(dia, mesAtual, anoAtual);
                const feriadoNome = feriados[`${anoAtual}-${mesAtual}-${dia}`] || feriados[`${mesAtual}-${dia}`];
                
                if (info.resp === 'mae') totalMaeMes++;
                else if (info.resp === 'pai') totalPaiMes++;

                const dataCelula = new Date(anoAtual, mesAtual, dia);
                const isPassado = dataCelula < dataHoje;
                const isHoje = (anoAtual === hojeReal.getFullYear() && mesAtual === hojeReal.getMonth() && dia === hojeReal.getDate());

                const cell = document.createElement('div');
                
                let bgClass = info.resp === 'mae' ? 'bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-900/50' : 'bg-sky-50 dark:bg-sky-950/40 border-sky-200 dark:border-sky-900/50';
                let textClass = info.resp === 'mae' ? 'text-rose-700 dark:text-rose-300' : 'text-sky-700 dark:text-sky-300';
                let badgeClass = info.resp === 'mae' ? 'bg-rose-100 dark:bg-rose-900/60 text-rose-800 dark:text-rose-200' : 'bg-sky-100 dark:bg-sky-900/60 text-sky-800 dark:text-sky-200';

                if (isPassado) {
                    bgClass += ' past-day';
                }

                if (isHoje) {
                    bgClass += ' ring-2 ring-indigo-500 dark:ring-indigo-400 shadow-sm';
                }

                cell.className = `day-cell-screen rounded-xl border p-1 flex flex-col justify-between relative transition-transform active:scale-95 cursor-pointer select-none ${bgClass}`;
                cell.onclick = () => editarDia(anoAtual, mesAtual, dia);
                
                let badgesHtml = '';
                if (feriadoNome) badgesHtml += `<span class="text-[7px] bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200 px-1 rounded truncate text-center font-bold block mb-0.5">${feriadoNome}</span>`;
                
                badgesHtml += `<span class="text-[9px] px-1 rounded truncate text-center font-bold block ${badgeClass}">${info.desc}</span>`;
                
                cell.innerHTML = `
                    <div class="day-num text-[11px] font-extrabold ${textClass}">${dia}</div>
                    <div class="flex flex-col gap-0.5">${badgesHtml}</div>
                `;
                grid.appendChild(cell);
            }

            document.getElementById('countMae').innerText = `${totalMaeMes} dias`;
            document.getElementById('countPai').innerText = `${totalPaiMes} dias`;

            // Atualização da barra de proporção
            const totalSoma = totalMaeMes + totalPaiMes;
            const pctMae = totalSoma > 0 ? Math.round((totalMaeMes / totalSoma) * 100) : 50;
            const pctPai = 100 - pctMae;
            document.getElementById('barraMae').style.width = `${pctMae}%`;
            document.getElementById('barraPai').style.width = `${pctPai}%`;
            document.getElementById('labelPctMae').innerText = `${pctMae}% Mãe`;
            document.getElementById('labelPctPai').innerText = `${pctPai}% Pai`;

            let totalMaeAnoLoop = 0;
            let totalPaiAnoLoop = 0;
            for (let m = 0; m < 12; m++) {
                const diasDoMes = new Date(anoAtual, m + 1, 0).getDate();
                for (let d = 1; d <= diasDoMes; d++) {
                    const inf = regraPadrao(d, m, anoAtual);
                    if (inf.resp === 'mae') totalMaeAnoLoop++;
                    else if (inf.resp === 'pai') totalPaiAnoLoop++;
                }
            }
            document.getElementById('countMaeAno').innerText = `${totalMaeAnoLoop} dias`;
            document.getElementById('countPaiAno').innerText = `${totalPaiAnoLoop} dias`;
        }

        function mudarMes(delta) {
            vibrar(10);
            mesAtual += delta;
            if (mesAtual > 11) { mesAtual = 0; anoAtual++; } 
            else if (mesAtual < 0) { mesAtual = 11; anoAtual--; }
            renderizar();
        }

        function gerenarAnoCompletoPDF() {
            vibrar();
            let dataHoje = new Date(hojeReal.getFullYear(), hojeReal.getMonth(), hojeReal.getDate());

            let htmlAnual = `<!DOCTYPE html>
            <html lang="pt-BR">
            <head>
                <meta charset="UTF-8">
                <title>Guarda Compartilhada - A partir de ${nomesMeses[mesAtual]} ${anoAtual}</title>
                <style>
                    body { font-family: sans-serif; padding: 20px; color: #0f172a; margin: 0; }
                    .mes-pagina-impressao { page-break-after: always; break-after: page; padding-bottom: 20px; }
                    h2 { text-align: center; margin-bottom: 10px; font-size: 1.2rem; }
                    table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 10px; }
                    th { background: #f8fafc; font-size: 0.75rem; padding: 6px; border: 1px solid #cbd5e1; text-align: center; font-weight: bold; }
                    td { width: 14.28%; height: 65px; vertical-align: top; border: 1px solid #cbd5e1; border-radius: 8px; padding: 4px; box-sizing: border-box; }
                    .day-num { font-size: 0.8rem; font-weight: bold; position: relative; }
                    .badge { font-size: 0.6rem; padding: 2px; border-radius: 2px; display: block; text-align: center; margin-top: 2px; font-weight: bold; }
                    .cell-mae { background-color: #ffe4e6 !important; color: #9f1239 !important; }
                    .cell-pai { background-color: #e0f2fe !important; color: #1e40af !important; }
                    
                    .past-day .day-num::after {
                        content: "";
                        position: absolute;
                        left: -4px;
                        right: -4px;
                        top: 50%;
                        height: 1.5px;
                        background-color: #000000;
                        transform: translateY(-50%);
                    }

                    .rule-box { padding: 8px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.75rem; margin-top: 5px; }
                    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
                </style>
            </head>
            <body>`;

            let startY = anoAtual;
            let startM = mesAtual;

            for (let y = startY; y <= 2027; y++) {
                let mInicio = (y === startY) ? startM : 0;
                let mFim = 11;
                for (let m = mInicio; m <= mFim; m++) {
                    let mesNome = nomesMeses[m];
                    let regra = regrasPorAnoMes[`${y}-${m}`] || `<b>${mesNome} ${y}:</b> Guarda Compartilhada.`;
                    
                    let tableHtml = '<table><thead><tr>';
                    ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].forEach(d => { tableHtml += `<th>${d}</th>`; });
                    tableHtml += '</tr></thead><tbody><tr>';

                    const primeiroDia = new Date(y, m, 1).getDay();
                    const totalDias = new Date(y, m + 1, 0).getDate();

                    let colCount = 0;
                    for (let i = 0; i < primeiroDia; i++) {
                        tableHtml += `<td></td>`;
                        colCount++;
                    }

 primeiroDia; i++) {
                        tableHtml += `<td></td>`;
                        colCount++;
                    }

                    for (let dia = 1; dia <= totalDias; dia++) {
                        if (colCount % 7 === 0 && colCount > 0) { tableHtml += '</tr><tr>'; }
                        const info = regraPadrao(dia, m, y);
                        let cssClass = info.resp === 'mae' ? 'cell-mae' : 'cell-pai';

                        const dataCelula = new Date(y, m, dia);
                        if (dataCelula < dataHoje) {
                            cssClass += ' past-day';
                        }

                        tableHtml += `<td class="${cssClass}"><div class="day-num">${dia}</div><div class="badge">${info.desc}</div></td>`;
                        colCount++;
                    }
                    while (colCount % 7 !== 0) { tableHtml += `<td></td>`; colCount++; }
                    tableHtml += '</tr></tbody></table>';

                    htmlAnual += `
                        <div class="mes-pagina-impressao">
                            <h2>Guarda Compartilhada - ${mesNome} ${y}</h2>
                            ${tableHtml}
                            <div class="rule-box">${regra}</div>
                        </div>
                    `;
                }
            }

            htmlAnual += `<script>window.onload = function() { window.print(); }<\/script></body></html>`;

            let blob = new Blob([htmlAnual], { type: 'text/html;charset=utf-8' });
            let url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        renderizar();
    </script>
</body>
